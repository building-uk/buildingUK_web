<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circular border -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2.5"/>
  
  <!-- Top Red Arc -->
  <path d="M 32 90 A 75 75 0 0 1 168 90" fill="none" stroke="#E61825" stroke-width="6.5" stroke-linecap="round"/>
  
  <!-- Subtle Grey Arc underneath -->
  <path d="M 38 122 A 75 75 0 0 0 162 122" fill="none" stroke="#F3F4F6" stroke-width="4"/>
  
  <!-- Which? text -->
  <g id="brand-text">
    <text x="96" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" fill="#111827" text-anchor="middle" letter-spacing="-0.5">Which<tspan fill="#E61825">?</tspan></text>
    <rect x="134" y="87" width="14" height="6.5" rx="1.5" fill="#E61825"/>
  </g>
  
  <!-- Trusted Trader text -->
  <text x="100" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#1F2937" text-anchor="middle" letter-spacing="-0.2">Trusted Trader</text>
</svg>
