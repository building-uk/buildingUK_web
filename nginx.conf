server {
    listen 80;
    server_name building.uk.com www.building.uk.com _;

    # 301 Redirect non-www to https://www.building.uk.com
    if ($host = "building.uk.com") {
        return 301 https://www.building.uk.com$request_uri;
    }

    # 301 Redirect HTTP to HTTPS when behind a reverse proxy / load balancer
    if ($http_x_forwarded_proto = "http") {
        return 301 https://www.building.uk.com$request_uri;
    }

    # 301 Redirects for renamed services
    location = /services/residential-refurbishment {
        return 301 /services/whole-home-refurbishment;
    }
    location = /services/restoration-services {
        return 301 /services/whole-home-refurbishment;
    }
    location = /services/commercial-services {
        return 301 /services/home-repairs-maintenance;
    }

    # Frontend - SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Sanity Studio - SPA routing
    location /studio {
        alias /usr/share/nginx/html/studio;
        index index.html;
        try_files $uri $uri/ /studio/index.html;
    }
}
