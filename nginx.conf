server {
    listen 80;
    server_name _;

    # 301 Redirects for renamed services
    location = /services/residential-refurbishment {
        return 301 /services/whole-home-refurbishment;
    }
    location = /services/restoration-services {
        return 301 /services/whole-home-refurbishment;
    }
    location = /services/commercial-services {
        return 301 /services/home-repairs-maintenance;
    }

    # Frontend - SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Sanity Studio - SPA routing
    location /studio {
        alias /usr/share/nginx/html/studio;
        index index.html;
        try_files $uri $uri/ /studio/index.html;
    }
}
